name: Test Systemd container

on: [push]

jobs:
  run-systemd-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH keys
        if: runner.os != 'Windows'
        run: |
          KEYS_DIR="${{ github.workspace }}/keys"
          mkdir -p "$KEYS_DIR"
          ssh-keygen -t ed25519 -C "crane-sim" -f "$KEYS_DIR/id_ed25519" -N ""
          cp "$KEYS_DIR/id_ed25519.pub" "$KEYS_DIR/authorized_keys"
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config <<EOF

          # crane-vps

          Host *
            StrictHostKeyChecking no
            LogLevel ERROR

          Host vps1
            HostName localhost
            Port 2221
            User crane
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null

          Host vps2
            HostName localhost
            Port 2222
            User crane
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null

          Host vps3
            HostName localhost
            Port 2223
            User crane
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: Debug Environment Information
        if: runner.os != 'Windows'
        run: |
          echo "================= Current User & ID ================="
          whoami
          id
          echo "================= SSH configuration ================="
          ls -la ${{ github.workspace }}/keys || true
          ls -la ~/.ssh || true
          cat ~/.ssh/config || true
          echo "=========== Docker & Docker Compose info ==========="
          docker --version || true
          docker compose version || true
          docker ps -a || true
          echo "===================================================="

      - name: compose up
        run: |
          docker compose up -d

      - name: get docker ps
        run: |
          # Wait briefly for systemd initialization
          sleep 5
          docker ps -a

      - name: Verify Systemd is Running
        run: |
          docker exec vps1 systemctl status

      - name: Test Service Execution
        run: |
          # Example: Install and verify a systemd service (nginx)
          docker exec vps1 apt-get update
          docker exec vps1 apt-get install -y nginx
          docker exec vps1 systemctl is-active nginx

      - name: compos down
        if: always()
        run: |
          docker compose down
